name: Update packages

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-packages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.publish.outputs.revision }}
      changed: ${{ steps.publish.outputs.changed }}
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_REPOSITORY: citizenhicks/mobius
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Update package definitions
        run: |
          latest_tag() {
            gh api --paginate "repos/$SOURCE_REPOSITORY/releases?per_page=100" --jq \
              '.[] | select(.draft == false and .prerelease == false) | .tag_name' |
              grep -E "^$1-v[0-9]+\.[0-9]+\.[0-9]+$" | sort -V | tail -1
          }
          cli_tag="$(latest_tag mobius-cli)"
          cli_version="${cli_tag#mobius-cli-v}"
          desktop_tag="$(latest_tag mobius-desktop)"
          desktop_version="${desktop_tag#mobius-desktop-v}"
          # The CLI release owns the compatible gateway version; publishing a newer
          # gateway alone must not promote it beside an older client.
          gateway_requirement="$(gh api \
            "repos/$SOURCE_REPOSITORY/contents/crates/mobius-cli/Cargo.toml?ref=$cli_tag" \
            --jq .content | base64 --decode | python3 -c \
            'import sys, tomllib; print(tomllib.load(sys.stdin.buffer)["dependencies"]["mobius-gateway"]["version"])')"
          [[ "$gateway_requirement" =~ ^=([0-9]+\.[0-9]+\.[0-9]+)$ ]]
          gateway_version="${BASH_REMATCH[1]}"
          gateway_tag="mobius-gateway-v$gateway_version"
          gh release view "$gateway_tag" --repo "$SOURCE_REPOSITORY" \
            --json isDraft,isPrerelease | jq -e '.isDraft == false and .isPrerelease == false' >/dev/null

          mkdir checksums
          gh release download "$cli_tag" --repo "$SOURCE_REPOSITORY" \
            --pattern '*.sha256' --dir checksums
          gh release download "$gateway_tag" --repo "$SOURCE_REPOSITORY" \
            --pattern '*.sha256' --dir checksums
          gh release download "$desktop_tag" --repo "$SOURCE_REPOSITORY" \
            --pattern "mobius-desktop-$desktop_version.zip.sha256" --dir checksums

          checksum() {
            local value
            value="$(awk 'NR == 1 { print $1 }' "checksums/$1.sha256")"
            [[ "$value" =~ ^[0-9a-f]{64}$ ]] || return 1
            printf '%s' "$value"
          }
          CLI_VERSION="$cli_version"
          GATEWAY_VERSION="$gateway_version"
          CLI_MAC_SHA="$(checksum "mobius-$cli_version-aarch64-apple-darwin.tar.gz")"
          CLI_LINUX_SHA="$(checksum "mobius-$cli_version-x86_64-unknown-linux-gnu.tar.gz")"
          GATEWAY_MAC_SHA="$(checksum "mobius-gateway-$gateway_version-aarch64-apple-darwin.tar.gz")"
          GATEWAY_LINUX_SHA="$(checksum "mobius-gateway-$gateway_version-x86_64-unknown-linux-gnu.tar.gz")"
          DESKTOP_VERSION="$desktop_version"
          DESKTOP_SHA="$(checksum "mobius-desktop-$desktop_version.zip")"
          export CLI_VERSION GATEWAY_VERSION CLI_MAC_SHA CLI_LINUX_SHA
          export GATEWAY_MAC_SHA GATEWAY_LINUX_SHA
          export DESKTOP_VERSION DESKTOP_SHA

          ruby <<'RUBY'
          def update(path, tag, version, checksums)
            content = File.read(path)
            match = content.match(/#{tag}-v(\d+\.\d+\.\d+)/) or raise "missing #{tag} version"
            current = match[1]
            content.gsub!(current, version)
            checksums.each do |asset, variable|
              pattern = /(#{Regexp.escape(asset)}"\n\s+sha256 ")[0-9a-f]{64}/
              raise "missing #{asset} in #{path}" unless content.sub!(pattern, "\\1#{ENV.fetch(variable)}")
            end
            File.write(path, content)
          end

          cli_version = ENV.fetch("CLI_VERSION")
          gateway_version = ENV.fetch("GATEWAY_VERSION")
          update("Formula/mobius-cli.rb", "mobius-cli", cli_version, {
            "mobius-#{cli_version}-aarch64-apple-darwin.tar.gz" => "CLI_MAC_SHA",
            "mobius-#{cli_version}-x86_64-unknown-linux-gnu.tar.gz" => "CLI_LINUX_SHA",
          })
          update("Formula/mobius-gateway.rb", "mobius-gateway", gateway_version, {
            "mobius-gateway-#{gateway_version}-aarch64-apple-darwin.tar.gz" => "GATEWAY_MAC_SHA",
            "mobius-gateway-#{gateway_version}-x86_64-unknown-linux-gnu.tar.gz" => "GATEWAY_LINUX_SHA",
          })
          path = "Casks/mobius-app.rb"
          content = File.read(path)
          raise "missing desktop version" unless content.sub!(/^  version "[0-9.]+"$/, "  version \"#{ENV.fetch('DESKTOP_VERSION')}\"")
          raise "missing desktop checksum" unless content.sub!(/^  sha256 "[0-9a-f]{64}"$/, "  sha256 \"#{ENV.fetch('DESKTOP_SHA')}\"")
          File.write(path, content)
          RUBY

      - name: Publish update
        id: publish
        run: |
          git diff --check
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Formula Casks
          git commit -m "Update mobius packages"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  check:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/check.yml
    with:
      ref: ${{ needs.update.outputs.revision }}
