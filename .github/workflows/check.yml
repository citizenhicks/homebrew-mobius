name: Check packages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Load this tap
        run: |
          brew tap citizenhicks/mobius "$GITHUB_WORKSPACE"
          brew trust --formula citizenhicks/mobius/mobius-cli citizenhicks/mobius/mobius-gateway
          brew trust --cask citizenhicks/mobius/mobius-app
      - name: Check package definitions
        run: |
          brew style citizenhicks/mobius/mobius-cli citizenhicks/mobius/mobius-gateway citizenhicks/mobius/mobius-app
          brew audit --strict citizenhicks/mobius/mobius-cli citizenhicks/mobius/mobius-gateway
      - name: Install and test binaries
        run: |
          brew install citizenhicks/mobius/mobius-cli
          brew test citizenhicks/mobius/mobius-cli citizenhicks/mobius/mobius-gateway
      - name: Verify app archive
        run: brew fetch --cask citizenhicks/mobius/mobius-app
